<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css">
<style>
 .half { position:absolute; top:0; bottom:0; background-size:cover; background-position:center; }
 .l { left:0; width:52%; clip-path: polygon(0 0, 100% 0, 86% 100%, 0 100%); }
 .r { right:0; width:56%; }
 .tag { position:absolute; top:26px; padding:8px 14px; border-radius:10px; background:rgba(0,0,0,.62); font-size:20px; font-weight:600; }
 .panel { position:absolute; left:0; right:0; bottom:0; padding:30px 44px 34px; background:linear-gradient(0deg, rgba(8,11,15,.96) 0%, rgba(8,11,15,.86) 70%, rgba(8,11,15,0) 100%); }
 .t { font-size:84px; font-weight:800; letter-spacing:-.02em; line-height:1 }
 .s { font-size:34px; font-weight:600; margin-top:10px }
 .k { position:absolute; right:40px; bottom:40px; text-align:right; border:2px solid #fab219; border-radius:16px; padding:12px 20px; background:rgba(8,11,15,.75) }
 .k b { font-size:52px; font-weight:800; display:block; line-height:1 }
 .k span { font-size:18px; color:#e1e0d9 }
</style></head>
<body style="width:1280px;height:720px">
 <div class="half r" style="background-image:url(s1.webp)"></div>
 <div class="half l" style="background-image:url(s2.webp)"></div>
 <div class="tag" style="left:26px">&#9729; Optical: 99% cloud</div>
 <div class="tag" style="right:26px">&#128225; Radar: banks visible</div>
 <div class="panel">
   <div class="row"><img src="logo.svg" style="width:76px;height:76px;border-radius:16px"><div class="t">NadiNet</div></div>
   <div class="s">Seeing riverbanks <span class="blue">through monsoon cloud</span></div>
 </div>
 <div class="k"><b>42% <span style="font-size:28px;color:#c3c2b7">vs</span> 4%</b><span>real erosion caught in top 20<br>vs &ldquo;it eroded recently&rdquo;</span></div>
</body></html>
